name: Sync selected FreeBSD packages

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Build exactly one canonical target"
        required: true
        type: choice
        options:
          - "FreeBSD:9:amd64"
          - "FreeBSD:9:i386"
          - "FreeBSD:10:amd64"
          - "FreeBSD:10:i386"
          - "FreeBSD:11:amd64"
          - "FreeBSD:11:i386"
          - "FreeBSD:12:amd64"
          - "FreeBSD:12:i386"
          - "FreeBSD:13:amd64"
          - "FreeBSD:13:i386"
          - "FreeBSD:14:amd64"
          - "FreeBSD:14:i386"
      allow_binary_push:
        description: "Push generated canonical latest repository after safety checks"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: freebsd-selected-pkg-sync-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout repository branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install importer dependencies
        run: python -m pip install --disable-pip-version-check requests zstandard

      - name: Validate importer
        run: |
          python -m py_compile scripts/build_repo.py scripts/build_repo_v2.py scripts/build_repo_cohorts.py scripts/preflight_repo.py scripts/render_config_guide.py
          python -m json.tool config/roots.json >/dev/null
          python -m json.tool config/sources.json >/dev/null

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Metadata-only safety preflight
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          echo "Preflight reads repository catalogs only; package payloads are not downloaded."
          python scripts/preflight_repo.py --target "${TARGET}"

      - name: Dry-run result
        if: ${{ !inputs.allow_binary_push }}
        shell: bash
        run: |
          echo "Metadata preflight passed. Binary download, canonical latest staging, commit and push were NOT requested."

      - name: Build one ABI repository
        if: ${{ inputs.allow_binary_push }}
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          args=(--target "${TARGET}")
          if [[ "${TARGET}" == "FreeBSD:12:amd64" ]]; then
            args+=(--migrate-existing-12)
          fi
          python scripts/build_repo_cohorts.py "${args[@]}"
          python scripts/render_config_guide.py --target "${TARGET}"

      - name: Validate canonical latest repository locally
        if: ${{ inputs.allow_binary_push }}
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          test -f "${TARGET}/latest/meta.conf"
          test -f "${TARGET}/latest/meta.txz"
          test -f "${TARGET}/latest/packagesite.txz"
          test -f "${TARGET}/latest/SHA256SUMS"
          python - <<'PY'
          import os, tarfile
          from pathlib import Path
          target = os.environ['TARGET']
          p = Path(target) / 'latest' / 'packagesite.txz'
          with tarfile.open(p, 'r:xz') as tf:
              names = {Path(x.name).name for x in tf.getmembers() if x.isfile()}
          if 'packagesite.yaml' not in names:
              raise SystemExit('packagesite.txz does not contain packagesite.yaml')
          print('canonical latest metadata OK:', target)
          PY

      - name: Stage canonical latest and audit metadata only
        if: ${{ inputs.allow_binary_push }}
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          KEY="${TARGET//:/-}"
          git add -A -- "${TARGET}/latest" "MANIFESTS/${KEY}.json" "MANIFESTS/${KEY}" "SOURCES/${KEY}.json" "CONFIGS/${KEY}.md"
          echo "Cohort build directories under ${TARGET}/repos are intentionally not part of the canonical user endpoint update."

      - name: Binary and push safety gate
        if: ${{ inputs.allow_binary_push }}
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          target = os.environ["TARGET"]
          max_file = 99 * 1024 * 1024
          max_staged = 1536 * 1024 * 1024

          raw = subprocess.check_output(["git", "diff", "--cached", "--name-only", "-z"])
          names = [x.decode("utf-8") for x in raw.split(b"\0") if x]
          oversized = []
          staged_bytes = 0
          for name in names:
              p = Path(name)
              if not p.is_file():
                  continue
              size = p.stat().st_size
              staged_bytes += size
              if size > max_file:
                  oversized.append((name, size))

          print(f"Staged paths: {len(names)}")
          print(f"Conservative staged working-tree size: {staged_bytes / 1024 / 1024:.1f} MiB")
          if oversized:
              for name, size in oversized:
                  print(f"ERROR: file exceeds 99 MiB canonical raw Git safety ceiling: {name} ({size / 1024 / 1024:.1f} MiB)")
              raise SystemExit(20)
          if staged_bytes > max_staged:
              print(f"ERROR: selected target exceeds the 1.5 GiB per-run safety ceiling: {target}")
              raise SystemExit(21)
          PY

      - name: Commit and push canonical raw repository
        if: ${{ inputs.allow_binary_push }}
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          PUSH_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "No canonical repository changes for ${TARGET}"
            exit 0
          fi

          git fetch --depth=1 origin "${PUSH_BRANCH}"
          LOCAL_HEAD="$(git rev-parse HEAD)"
          REMOTE_HEAD="$(git rev-parse FETCH_HEAD)"
          if [[ "${LOCAL_HEAD}" != "${REMOTE_HEAD}" ]]; then
            echo "::error::Branch changed during the run; refusing automatic rebase/retry. Run again from the new HEAD."
            exit 30
          fi

          git commit -m "Publish ${TARGET} canonical raw latest repository"
          git push origin HEAD:"${PUSH_BRANCH}"

      - name: Verify raw.githubusercontent.com endpoint
        if: ${{ inputs.allow_binary_push }}
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/${TARGET}/latest"
          curl -fL --retry 10 --retry-delay 3 --retry-all-errors "${BASE}/meta.conf" -o /tmp/meta.conf
          curl -fL --retry 10 --retry-delay 3 --retry-all-errors "${BASE}/packagesite.txz" -o /tmp/packagesite.txz
          python - <<'PY'
          import tarfile
          from pathlib import Path
          with tarfile.open('/tmp/packagesite.txz', 'r:xz') as tf:
              names = {Path(x.name).name for x in tf.getmembers() if x.isfile()}
          if 'packagesite.yaml' not in names:
              raise SystemExit('remote packagesite.txz invalid')
          print('remote canonical metadata OK')
          PY
          first_pkg="$(awk 'NF >= 2 {print $2; exit}' "${TARGET}/latest/SHA256SUMS" || true)"
          if [[ -n "${first_pkg}" ]]; then
            curl -fIL --retry 10 --retry-delay 3 --retry-all-errors "${BASE}/${first_pkg}" >/dev/null
            echo "remote package object reachable: ${first_pkg}"
          else
            echo "canonical repository is intentionally empty; metadata endpoint is valid"
          fi
