name: X32 exact gap source probe

on:
  push:
    paths:
      - '.github/workflows/x32-final-gap-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x32-exact-gap-source-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts
            config
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests zstandard
      - name: Probe historical catalogs and direct missing package objects
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python - <<'PY'
          import io, json, tarfile
          from pathlib import Path
          from urllib.parse import urljoin
          import requests, zstandard as zstd
          import build_repo as core

          targets = {
            'FreeBSD:12:i386': {
              'root':'subversion',
              'needed': {'pinentry': {'1.2.1'}},
              'sources': [
                ('sggs-12i386-latest','https://mirror.sg.gs/freebsd-pkg/FreeBSD:12:i386/latest/'),
                ('sggs-12i386-quarterly-candidate','https://mirror.sg.gs/freebsd-pkg/FreeBSD:12:i386/quarterly/'),
                ('neonet-12i386-latest-candidate','https://ftp.neonet.bc.ca/freebsd-pkg/FreeBSD:12:i386/latest/'),
                ('neonet-12i386-quarterly-candidate','https://ftp.neonet.bc.ca/freebsd-pkg/FreeBSD:12:i386/quarterly/'),
              ] + [(f'official-12i386-release{i}-candidate', f'https://pkg.freebsd.org/FreeBSD:12:i386/release_{i}/') for i in range(0,7)],
            },
            'FreeBSD:13:i386': {
              'root':'subversion',
              'needed': {'pinentry': {'1.3.1_1','1.3.2_1'}},
              'sources': [
                ('freebsd-13i386-latest-candidate','https://pkg.freebsd.org/FreeBSD:13:i386/latest/'),
                ('freebsd-13i386-quarterly-candidate','https://pkg.freebsd.org/FreeBSD:13:i386/quarterly/'),
                ('sggs-13i386-latest-candidate','https://mirror.sg.gs/freebsd-pkg/FreeBSD:13:i386/latest/'),
                ('sggs-13i386-quarterly-candidate','https://mirror.sg.gs/freebsd-pkg/FreeBSD:13:i386/quarterly/'),
              ] + [(f'official-13i386-release{i}-candidate', f'https://pkg.freebsd.org/FreeBSD:13:i386/release_{i}/') for i in range(0,6)],
            },
            'FreeBSD:14:i386': {
              'root':'subversion',
              'needed': {'pinentry': {'1.3.3'}},
              'sources': [
                ('freebsd-14i386-latest-candidate','https://pkg.freebsd.org/FreeBSD:14:i386/latest/'),
                ('freebsd-14i386-quarterly-candidate','https://pkg.freebsd.org/FreeBSD:14:i386/quarterly/'),
                ('sggs-14i386-latest-candidate','https://mirror.sg.gs/freebsd-pkg/FreeBSD:14:i386/latest/'),
                ('sggs-14i386-quarterly-candidate','https://mirror.sg.gs/freebsd-pkg/FreeBSD:14:i386/quarterly/'),
              ] + [(f'official-14i386-release{i}-candidate', f'https://pkg.freebsd.org/FreeBSD:14:i386/release_{i}/') for i in range(0,6)],
            },
            'FreeBSD:10:i386': {
              'root':'devil',
              'needed': {
                'libpthread-stubs': {'0.4'},
                'pciids': {'20180921','20181027'},
              },
              'sources': [
                ('neonet-10i386-quarterly','https://ftp.neonet.bc.ca/freebsd-pkg/FreeBSD:10:i386/quarterly/'),
                ('neonet-10i386-latest','https://ftp.neonet.bc.ca/freebsd-pkg/FreeBSD:10:i386/latest/'),
                ('sggs-10i386-latest-candidate','https://mirror.sg.gs/freebsd-pkg/FreeBSD:10:i386/latest/'),
                ('sggs-10i386-quarterly-candidate','https://mirror.sg.gs/freebsd-pkg/FreeBSD:10:i386/quarterly/'),
              ] + [(f'official-10i386-release{i}-candidate', f'https://pkg.freebsd.org/FreeBSD:10:i386/release_{i}/') for i in range(0,6)],
            },
          }

          def by_name(rows):
            d={}
            for c in rows: d.setdefault(c['name'],[]).append(c)
            return d

          def walk(c, bn, seen, missing):
            key=(c['name'],c['version'])
            if key in seen: return
            seen.add(key)
            for dn,dv in core.deps(c):
              opts=bn.get(dn,[])
              exact=[x for x in opts if not dv or x['version']==dv]
              choices=exact or opts
              if not choices:
                missing.append({'required_by':c['name'],'dependency':dn,'required_version':dv})
                continue
              walk(core.ordered(choices)[0],bn,seen,missing)

          def inspect_pkg(blob, ext):
            bio=io.BytesIO(blob)
            if ext == '.pkg':
              with zstd.ZstdDecompressor().stream_reader(bio) as zr:
                raw=zr.read()
              tf=tarfile.open(fileobj=io.BytesIO(raw),mode='r:')
            else:
              tf=tarfile.open(fileobj=bio,mode='r:*')
            try:
              members={Path(m.name).name:m for m in tf.getmembers() if m.isfile()}
              for n in ('+COMPACT_MANIFEST','+MANIFEST'):
                if n in members:
                  return json.loads(tf.extractfile(members[n]).read().decode('utf-8','replace'))
            finally:
              tf.close()
            return None

          s=core.session()
          result={}
          for target,cfg in targets.items():
            result[target]=[]
            major,_=core.target_parts(target)
            ext='.txz' if major <= 11 else '.pkg'
            for prio,(sid,url) in enumerate(cfg['sources']):
              rows=core.remote_catalog(s,{'id':sid,'url':url},target,prio)
              for c in rows: c['target']=target
              bn=by_name(rows)
              root_versions=[x['version'] for x in core.ordered(bn.get(cfg['root'],[]))]
              needed_found={n:sorted({x['version'] for x in bn.get(n,[])}) for n in cfg['needed'] if bn.get(n)}
              root_missing=[]
              if root_versions:
                rc=core.ordered(bn[cfg['root']])[0]
                seen=set(); walk(rc,bn,seen,root_missing)
              direct=[]
              for name,versions in cfg['needed'].items():
                for ver in sorted(versions):
                  fn=f'{name}-{ver}{ext}'
                  for rel in (f'All/{fn}',fn):
                    u=urljoin(url,rel)
                    try:
                      r=s.get(u,timeout=(15,90),allow_redirects=True)
                      if r.status_code != 200:
                        continue
                      mani=inspect_pkg(r.content,ext)
                      direct.append({'name':name,'version':ver,'url':u,'bytes':len(r.content),'manifest_name':(mani or {}).get('name'),'manifest_version':(mani or {}).get('version'),'manifest_arch':(mani or {}).get('arch'),'manifest_abi':(mani or {}).get('abi'),'abi_ok':core.abi_ok(target,(mani or {}).get('abi'),(mani or {}).get('arch'))})
                      break
                    except Exception:
                      pass
              item={'source':sid,'url':url,'records':len(rows),'root_versions':root_versions,'needed_found':needed_found,'root_missing_dependencies':root_missing[:30],'direct_objects':direct}
              print(json.dumps({'target':target,**item},sort_keys=True))
              result[target].append(item)
          print('=== X32_EXACT_GAP_PROBE_JSON ===')
          print(json.dumps(result,indent=2,sort_keys=True))
          PY
