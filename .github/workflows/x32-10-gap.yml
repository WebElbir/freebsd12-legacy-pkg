name: X32 FreeBSD 10 dependency gap

on:
  push:
    paths:
      - '.github/workflows/x32-10-gap.yml'
      - 'STATE/x32-10-gap-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts
            config
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests zstandard
      - name: Diagnose unresolved FreeBSD 10 i386 root closures
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python - <<'PY'
          import json
          import build_repo as core

          target='FreeBSD:10:i386'
          sources=[
            ('neonet-10i386-quarterly','https://ftp.neonet.bc.ca/freebsd-pkg/FreeBSD:10:i386/quarterly/'),
            ('neonet-10i386-latest','https://ftp.neonet.bc.ca/freebsd-pkg/FreeBSD:10:i386/latest/'),
          ]
          roots=['devil','gcc6','mysql57-client','mysql57-server']

          def walk(candidate, byname, seen, missing):
              key=(candidate['name'],candidate['version'])
              if key in seen: return
              seen.add(key)
              for dep,required in core.deps(candidate):
                  opts=byname.get(dep,[])
                  if not opts:
                      missing.append({'required_by':candidate['name'],'dependency':dep,'required_version':required,'reason':'dependency name absent'})
                      continue
                  exact=[x for x in opts if not required or x['version']==required]
                  choice=(exact or opts)[0]
                  walk(choice,byname,seen,missing)

          s=core.session(); out=[]
          for prio,(sid,url) in enumerate(sources):
              src={'id':sid,'url':url}
              rows=core.remote_catalog(s,src,target,prio)
              for c in rows: c['target']=target
              byname={}
              for c in rows: byname.setdefault(c['name'],[]).append(c)
              entry={'source':sid,'records':len(rows),'roots':{}}
              for root in roots:
                  candidates=core.ordered(byname.get(root,[]))
                  detail={'versions':[x['version'] for x in candidates]}
                  if candidates:
                      missing=[]; seen=set(); walk(candidates[0],byname,seen,missing)
                      detail['missing_dependencies']=missing[:100]
                      detail['closure_package_count_if_names_present']=len(seen)
                  entry['roots'][root]=detail
              out.append(entry)
              print(json.dumps(entry,sort_keys=True))
          print('=== X32_10_GAP_JSON ===')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
